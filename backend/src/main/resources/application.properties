spring.application.name=backend

# Conexión a PostgreSQL (Local por defecto, Variables de Entorno en la Nube)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mecacloud_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:mecacloud2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate (update crea las tablas en BD nueva en la nube)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Puerto dinámico para Render/Railway (8080 por defecto en local)
server.port=${PORT:8080}

# Clave secreta para firmar tokens JWT
jwt.secret=${JWT_SECRET:MecaCloudSaaS_ClaveSecretaSuperSegura_2026_Bogota_Colombia!}